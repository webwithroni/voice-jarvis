name: Build Debug APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Prepare CI signing keystore
        shell: bash
        env:
          VOICE_JARVIS_CI_KEYSTORE_B64: ${{ secrets.VOICE_JARVIS_CI_KEYSTORE_B64 }}
          VOICE_JARVIS_CI_STORE_PASSWORD: ${{ secrets.VOICE_JARVIS_CI_STORE_PASSWORD }}
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$RUNNER_TEMP/voice-jarvis-ci-debug.jks"

          printf '%s' "$VOICE_JARVIS_CI_KEYSTORE_B64" \
            | base64 --decode \
            > "$KEYSTORE_PATH"

          chmod 600 "$KEYSTORE_PATH"

          test -s "$KEYSTORE_PATH"

          echo "CI signing keystore prepared."

      - name: Build debug APK
        env:
          VOICE_JARVIS_CI_KEYSTORE_PATH: ${{ runner.temp }}/voice-jarvis-ci-debug.jks
          VOICE_JARVIS_CI_STORE_PASSWORD: ${{ secrets.VOICE_JARVIS_CI_STORE_PASSWORD }}
        run: gradle assembleDebug -PGROQ_API_KEY=${{ secrets.GROQ_API_KEY }} -PGEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} -PTAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }} -POPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }} -PDEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}

      - name: Inspect APK signing certificate
        shell: bash
        run: |
          echo "===== APK SIGNING CERTIFICATE ====="

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          if [ ! -x "$APKSIGNER" ]; then
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          fi

          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner -print || true
            exit 1
          fi

          echo "Using: $APKSIGNER"

          CERT_OUTPUT="$(
            "$APKSIGNER" verify \
              --verbose \
              --print-certs \
              app/build/outputs/apk/debug/app-debug.apk
          )"

          printf '%s\n' "$CERT_OUTPUT"

          EXPECTED_SHA1="14:3A:A3:CF:6B:4E:7D:FB:34:E4:C7:05:F8:2F:94:08:87:2A:59:A5"
          EXPECTED_SHA256="91:1E:75:88:9E:05:83:E9:E0:F2:F0:AE:6E:43:98:77:9C:DF:E2:B2:F9:A8:7B:60:4B:51:1E:ED:02:95:7B:98"

          printf '%s\n' "$CERT_OUTPUT" \
            | grep -F \
                "Signer #1 certificate SHA-1 digest: $EXPECTED_SHA1"

          printf '%s\n' "$CERT_OUTPUT" \
            | grep -F \
                "Signer #1 certificate SHA-256 digest: $EXPECTED_SHA256"

          echo "CI signing certificate matches expected stable certificate."

          echo "===== END APK SIGNING CERTIFICATE ====="

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
