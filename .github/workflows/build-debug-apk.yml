name: Build Debug APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Prepare CI signing keystore
        shell: bash
        env:
          VOICE_JARVIS_CI_KEYSTORE_B64: ${{ secrets.VOICE_JARVIS_CI_KEYSTORE_B64 }}
          VOICE_JARVIS_CI_STORE_PASSWORD: ${{ secrets.VOICE_JARVIS_CI_STORE_PASSWORD }}
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$RUNNER_TEMP/voice-jarvis-ci-debug.jks"

          printf '%s' "$VOICE_JARVIS_CI_KEYSTORE_B64" \
            | base64 --decode \
            > "$KEYSTORE_PATH"

          chmod 600 "$KEYSTORE_PATH"

          test -s "$KEYSTORE_PATH"

          echo "CI signing keystore prepared."

      - name: Build debug APK
        env:
          VOICE_JARVIS_CI_KEYSTORE_PATH: ${{ runner.temp }}/voice-jarvis-ci-debug.jks
          VOICE_JARVIS_CI_STORE_PASSWORD: ${{ secrets.VOICE_JARVIS_CI_STORE_PASSWORD }}
        run: gradle assembleDebug -PGROQ_API_KEY=${{ secrets.GROQ_API_KEY }} -PGEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} -PTAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }} -POPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }} -PDEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}

      - name: Inspect APK signing certificate
        shell: bash
        run: |
          echo "===== APK SIGNING CERTIFICATE ====="

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          if [ ! -x "$APKSIGNER" ]; then
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          fi

          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner -print || true
            exit 1
          fi

          echo "Using: $APKSIGNER"

          CERT_OUTPUT="$(
            "$APKSIGNER" verify \
              --verbose \
              --print-certs \
              app/build/outputs/apk/debug/app-debug.apk
          )"

          printf '%s\n' "$CERT_OUTPUT"

          EXPECTED_SHA1="143aa3cf6b4e7dfb34e4c705f82f9408872a59a5"
          EXPECTED_SHA256="911e75889e0583e9e0f2f0ae6e4398779cdfe2b2f9a87b604b511eed02957b98"

          ACTUAL_SHA1="$(
            printf '%s\n' "$CERT_OUTPUT" \
              | sed -n 's/^Signer #1 certificate SHA-1 digest: //p' \
              | tr -d ':[:space:]' \
              | tr '[:upper:]' '[:lower:]'
          )"

          ACTUAL_SHA256="$(
            printf '%s\n' "$CERT_OUTPUT" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
              | tr -d ':[:space:]' \
              | tr '[:upper:]' '[:lower:]'
          )"

          test "$ACTUAL_SHA1" = "$EXPECTED_SHA1"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"

          echo "CI signing certificate matches expected stable certificate."

          echo "===== END APK SIGNING CERTIFICATE ====="

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  ui-inflation:
    name: UI Inflation Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Run Android UI smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -no-snapshot-load
          disable-animations: true
          script: |
            gradle connectedDebugAndroidTest --stacktrace\n