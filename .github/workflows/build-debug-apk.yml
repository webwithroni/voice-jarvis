name: Build Debug APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug -PGROQ_API_KEY=${{ secrets.GROQ_API_KEY }} -PGEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} -PTAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }} -POPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }} -PDEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}

      - name: Inspect APK signing certificate
        shell: bash
        run: |
          echo "===== APK SIGNING CERTIFICATE ====="

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          if [ ! -x "$APKSIGNER" ]; then
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          fi

          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner -print || true
            exit 1
          fi

          echo "Using: $APKSIGNER"

          "$APKSIGNER" verify             --verbose             --print-certs             app/build/outputs/apk/debug/app-debug.apk

          echo "===== END APK SIGNING CERTIFICATE ====="

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
